version: "3.9"

# ============================================================
# Test Database Stack
# ============================================================
# All services use non-default ports to avoid conflicts with
# any locally-running development databases.
#
# PostgreSQL : 5433  (dev default: 5432)
# MySQL      : 3307  (dev default: 3306)
# MongoDB    : 27018 (dev default: 27017)
#
# Usage:
#   docker compose -f docker/docker-compose.test.yml up -d
#   docker compose -f docker/docker-compose.test.yml down -v
# ============================================================

networks:
  test-network:
    driver: bridge

volumes:
  postgres-test-data:
  mysql-test-data:
  mongo-test-data:

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres-test:
    image: postgres:16-alpine
    container_name: db-test-postgres
    restart: unless-stopped
    networks:
      - test-network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      postgres
        -c log_min_messages=WARNING
        -c log_connections=off
        -c max_connections=200
        -c shared_buffers=128MB
        -c work_mem=4MB

  # ── MySQL ───────────────────────────────────────────────────
  mysql-test:
    image: mysql:8.3
    container_name: db-test-mysql
    restart: unless-stopped
    networks:
      - test-network
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    volumes:
      - mysql-test-data:/var/lib/mysql
      - ./init-scripts/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "testuser",
          "--password=testpassword",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=128M

  # ── MongoDB ─────────────────────────────────────────────────
  mongo-test:
    image: mongo:7.0
    container_name: db-test-mongo
    restart: unless-stopped
    networks:
      - test-network
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: testpassword
      MONGO_INITDB_DATABASE: testdb
    volumes:
      - mongo-test-data:/data/db
      - ./init-scripts/mongo-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
          "--username",
          "testuser",
          "--password",
          "testpassword",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
